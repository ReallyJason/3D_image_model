<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="prismGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="prismGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="prismGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded shield -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- 3D Isometric Cube / Prism -->
  <g transform="translate(0, 1)" filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="32,13 49,23 32,33 15,23" fill="url(#prismGrad1)" />
    <!-- Left Face -->
    <polygon points="15,23 32,33 32,51 15,41" fill="url(#prismGrad2)" />
    <!-- Right Face -->
    <polygon points="32,33 49,23 49,41 32,51" fill="url(#prismGrad3)" />

    <!-- Isometric Wireframe Edges -->
    <line x1="32" y1="13" x2="49" y2="23" stroke="#e0f2fe" stroke-width="0.8" opacity="0.9" />
    <line x1="49" y1="23" x2="32" y2="33" stroke="#bae6fd" stroke-width="0.8" opacity="0.9" />
    <line x1="32" y1="33" x2="15" y2="23" stroke="#e0f2fe" stroke-width="0.8" opacity="0.9" />
    <line x1="15" y1="23" x2="32" y2="13" stroke="#bae6fd" stroke-width="0.8" opacity="0.9" />
    <line x1="32" y1="33" x2="32" y2="51" stroke="#f5d0fe" stroke-width="0.9" opacity="0.95" />
    <line x1="15" y1="23" x2="15" y2="41" stroke="#c7d2fe" stroke-width="0.8" opacity="0.9" />
    <line x1="49" y1="23" x2="49" y2="41" stroke="#ddd6fe" stroke-width="0.8" opacity="0.9" />
    <line x1="15" y1="41" x2="32" y2="51" stroke="#c7d2fe" stroke-width="0.8" opacity="0.9" />
    <line x1="32" y1="51" x2="49" y2="41" stroke="#ddd6fe" stroke-width="0.8" opacity="0.9" />

    <!-- Center Vertex Sparkle -->
    <circle cx="32" cy="33" r="1.8" fill="#ffffff" />
  </g>
</svg>
