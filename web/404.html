<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Page Not Found — 3D Vision Lab</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #07090e;
      --bg-card: rgba(17, 24, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-cyan: #38bdf8;
      --accent-purple: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 30%, #171f38 0%, var(--bg-base) 80%);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      overflow: hidden;
    }
    .error-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.1);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cube-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.75rem;
      position: relative;
    }
    .cube-container svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
      animation: gentleRotate 6s ease-in-out infinite alternate;
    }
    @keyframes gentleRotate {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-8px) rotate(3deg); }
    }
    .status-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 0.75rem;
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.975rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.55);
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: rgba(148, 163, 184, 0.6);
    }
  </style>
</head>
<body>
  <main class="error-card" role="main">
    <div class="cube-container">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="32,10 52,22 32,34 12,22" fill="#38bdf8" />
        <polygon points="12,22 32,34 32,54 12,42" fill="#6366f1" />
        <polygon points="32,34 52,22 52,42 32,54" fill="#a855f7" />
        <line x1="32" y1="34" x2="32" y2="54" stroke="#ffffff" stroke-width="1.5" />
      </svg>
    </div>
    <span class="status-code">HTTP 404 • Not Found</span>
    <h1>Coordinates Uncharted</h1>
    <p>The 3D model, mesh geometry, or page you requested does not exist or has expired from cache memory.</p>
    <a href="/" class="home-btn">
      <span>← Return to 3D Vision Lab</span>
    </a>
  </main>
  <footer class="footer-note">
    3D Vision Lab Engine • Watertight Neural 3D Generator
  </footer>
</body>
</html>
